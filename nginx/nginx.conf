worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # Compression to speed up WMS dashboard loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_min_length 512;

    # Backend Container (Docker DNS handles the 'backend' name)
    upstream backend_upstream {
        server backend:8000;
    }

    # Frontend Container
    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        # Listen on 80 inside the container (mapped to 81 on your Windows Host)
        listen 80;
        server_name _;

        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # 1. API Proxy (This is the critical fix)
        # Browsers calling /api/v1 will be routed here
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Ensure CORS isn't an issue at the Nginx level
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # 2. Media Files (Direct Access)
        location /media/ {
            alias /app/media/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # 3. Frontend UI
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Fix for Single Page Apps (SPA) routing
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
